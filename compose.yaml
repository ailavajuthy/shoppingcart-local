services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopping_cart_db
      POSTGRES_USER: shoppingcart
      POSTGRES_PASSWORD: local-demo-password
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./database/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U shoppingcart -d shopping_cart_db
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      args:
        APP_VERSION: v1
    ports:
    - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopping_cart_db?connectTimeout=3&socketTimeout=5
      DB_USER: shoppingcart
      DB_PASSWORD: local-demo-password
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: {}
