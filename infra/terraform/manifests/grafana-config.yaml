apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Prometheus\n  type: prometheus\n  uid: prometheus\n  url: http://prometheus:9090\n"
  dashboards.yaml: "apiVersion: 1\nproviders:\n- name: default\n  options:\n    path:\
    \ /var/lib/grafana/dashboards\n  type: file\n"
  shoppingcart.json: '{"uid": "shoppingcart", "title": "Shopping Cart Progressive
    Delivery", "schemaVersion": 39, "version": 1, "refresh": "5s", "time": {"from":
    "now-15m", "to": "now"}, "panels": [{"id": 1, "type": "timeseries", "title": "Request
    rate", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x":
    0, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "sum by(version) (rate(shoppingcart_requests_total[1m]))",
    "legendFormat": "{{version}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit":
    "reqps"}, "overrides": []}}, {"id": 2, "type": "timeseries", "title": "Server
    error rate", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos":
    {"x": 12, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "sum by(version) (rate(shoppingcart_requests_total{status=~\"5..\"}[1m]))
    / clamp_min(sum by(version) (rate(shoppingcart_requests_total[1m])),0.001)", "legendFormat":
    "{{version}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percentunit"},
    "overrides": []}}, {"id": 3, "type": "timeseries", "title": "Mean request latency",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0,
    "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "sum by(version) (rate(shoppingcart_request_duration_seconds_sum[1m]))
    / clamp_min(sum by(version) (rate(shoppingcart_requests_total[1m])),0.001)", "legendFormat":
    "{{version}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s"}, "overrides":
    []}}, {"id": 4, "type": "timeseries", "title": "Reachable application pods", "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 8, "w":
    12, "h": 8}, "targets": [{"expr": "sum(up{job=\"shoppingcart\"})", "legendFormat":
    "{{version}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"},
    "overrides": []}}]}'
