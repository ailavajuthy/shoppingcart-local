apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-traffic
  namespace: shoppingcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-traffic
  template:
    metadata:
      labels:
        app: demo-traffic
    spec:
      containers:
      - name: traffic
        image: python:3.12-alpine
        command:
        - python
        - -u
        - -c
        - "import urllib.request,time\nurls=[\"http://shoppingcart/demo/products\"\
          ,\"http://shoppingcart-canary/demo/products\"]\nwhile True:\n for url in\
          \ urls:\n  try:\n   with urllib.request.urlopen(url,timeout=3) as r: r.read()\n\
          \  except Exception: pass\n time.sleep(0.2)\n"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
