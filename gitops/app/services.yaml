apiVersion: v1
kind: Service
metadata:
  name: shoppingcart
  namespace: shoppingcart
spec:
  selector:
    app: shoppingcart
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingcart-stable
  namespace: shoppingcart
spec:
  selector:
    app: shoppingcart
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30082
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingcart-canary
  namespace: shoppingcart
spec:
  selector:
    app: shoppingcart
  ports:
  - name: http
    port: 80
    targetPort: 8080
