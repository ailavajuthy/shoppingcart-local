name: Build and publish shopping cart
on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'Dockerfile', '.github/workflows/build.yaml']
  workflow_dispatch:
    inputs:
      fault:
        description: 'Publish an intentionally faulty release for the rollback demo'
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
concurrency:
  group: shoppingcart-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase registry path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_FAULT=${{ inputs.fault || 'false' }}
      - name: Update desired image in Git
        run: |
          python3 scripts/update-image.py "$IMAGE" "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gitops/app/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy image $GITHUB_SHA"
          git pull --rebase origin main
          git push origin HEAD:main
