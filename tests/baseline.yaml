apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingcart-baseline
  namespace: shoppingcart
spec:
  replicas: 4
  selector:
    matchLabels:
      app: shoppingcart-baseline
  template:
    metadata:
      labels:
        app: shoppingcart-baseline
    spec:
      containers:
      - name: shoppingcart
        image: shoppingcart:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: DB_URL
          value: jdbc:postgresql://postgres:5432/shopping_cart_db?connectTimeout=3&socketTimeout=5
        - name: DB_USER
          value: shoppingcart
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          failureThreshold: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
